name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.5"

      - name: Install bubblewrap for sandboxed benchmark tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: Check bubblewrap namespace support
        run: |
          stat -c '%A %U:%G %n' "$(command -v bwrap)"
          args=(--unshare-all --die-with-parent --new-session --ro-bind /usr /usr)
          for name in bin lib lib64; do
            path="/$name"
            if [[ -L "$path" ]]; then
              args+=(--symlink "$(readlink "$path")" "$path")
            elif [[ -e "$path" ]]; then
              args+=(--ro-bind "$path" "$path")
            fi
          done
          bwrap "${args[@]}" --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true

      - name: Run Python tests
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Build frontend
        run: npm run build --prefix web

      - name: Set up Go when the repository contains a Go module
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test ./...

      - name: Build Go packages
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./...
