[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-environment"
version = "0.1.0"
description = "Local-first agent environment composition and lifecycle manager"
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.1",
    "eth-account==0.14.0",
    "jsonschema==4.26.0",
    "tomlkit==0.13.3",
]

[project.scripts]
ade = "ade.cli:main"

[tool.setuptools.packages.find]
include = ["ade*"]

[tool.setuptools.package-data]
ade = ["*.json"]
